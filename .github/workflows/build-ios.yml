name: Build iOS unsigned

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ios.yml'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'native/**'
      - 'tools/**'
      - 'assets/**'
      - 'vendor/**'
      - 'EntisGLS/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-unsigned-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  device:
    name: Unsigned iOS ARM64
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Prepare host tools
        run: |
          brew install bison
          echo "TJS_BISON=$(brew --prefix bison)/bin/bison" >> "$GITHUB_ENV"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Verify dependencies and build tools
        run: |
          python3 tools/ci_prepare_dependencies.py
          python3 -m unittest discover -s tools -p 'test_*.py' -v
      - name: Build unsigned device app and IPA
        run: |
          python3 tools/build_sdl_ios.py --sdk iphoneos --jobs 3 2>&1 | tee build/ci/ios-device.log
      - name: Collect release files
        run: |
          mkdir -p artifacts/ios-release
          cp artifacts/entisgls-launcher/ios-arm64/EntisGLSLauncher-unsigned.ipa artifacts/ios-release/EntisGLSLauncher-ios-arm64-unsigned.ipa
          cp artifacts/entisgls-launcher/ios-arm64/build.json artifacts/ios-release/EntisGLSLauncher-ios-arm64-unsigned.build.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-unsigned-release
          if-no-files-found: error
          compression-level: 0
          path: artifacts/ios-release/*
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-device-diagnostics
          if-no-files-found: ignore
          retention-days: 7
          path: |
            build/ci/ios-device.log
            build/ios-arm64/logs/*.log
            build/ci/dependencies.json
            artifacts/entisgls-launcher/ios-arm64/build.json

  simulator:
    name: iOS Simulator launch check
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Prepare host tools
        run: |
          brew install bison
          echo "TJS_BISON=$(brew --prefix bison)/bin/bison" >> "$GITHUB_ENV"
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
      - name: Verify dependencies
        run: python3 tools/ci_prepare_dependencies.py
      - name: Build simulator app
        run: |
          python3 tools/build_sdl_ios.py --sdk iphonesimulator --jobs 3 2>&1 | tee build/ci/ios-simulator.log
      - name: Verify launcher startup on iPhone simulator
        run: |
          python3 tools/ci_ios_simulator_smoke.py --app artifacts/entisgls-launcher/ios-simulator-arm64/EntisGLSLauncher.app --output artifacts/ios-smoke
      - name: Upload simulator diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-simulator-diagnostics
          if-no-files-found: ignore
          retention-days: 7
          path: |
            build/ci/ios-simulator.log
            build/ios-simulator-arm64/logs/*.log
            artifacts/ios-smoke/
            artifacts/entisgls-launcher/ios-simulator-arm64/build.json

  release:
    name: Publish unsigned iOS prerelease
    needs: [device, simulator]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: tools/ci_ios_release.py
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ios-unsigned-release
          path: ios-release-files
      - name: Verify unsigned IPA and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci_ios_release.py --artifacts ios-release-files
